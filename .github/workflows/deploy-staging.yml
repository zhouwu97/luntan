name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to build and deploy
        required: true
        type: string
      staging_base_url:
        description: Public HTTPS base URL used by the staging smoke test
        required: true
        default: https://shengbeijiang.com
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build immutable staging release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          printf '%s\n' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run Go verification
        working-directory: server
        run: |
          go test -p 1 ./...
          go vet ./...

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Run Flutter verification
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build staging Web bundle
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
        run: >-
          flutter build web --release --base-href=/forum/
          --dart-define=APP_ENV=qa
          --dart-define=API_BASE_URL=$STAGING_BASE_URL
          --dart-define=WEB_BASE_URL=$STAGING_BASE_URL

      - name: Build server binaries and assemble release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        working-directory: server
        run: |
          set -eu
          mkdir -p ../release/migrations ../release/web
          go build -trimpath -ldflags="-s -w -X github.com/zhouwu97/luntan/server/internal/platform/httpserver.BuildVersion=${RELEASE_SHA} -X github.com/zhouwu97/luntan/server/internal/platform/httpserver.BuildCommit=${RELEASE_SHA}" -o ../release/luntan-api ./cmd/api
          go build -trimpath -ldflags="-s -w -X github.com/zhouwu97/luntan/server/internal/platform/httpserver.BuildVersion=${RELEASE_SHA} -X github.com/zhouwu97/luntan/server/internal/platform/httpserver.BuildCommit=${RELEASE_SHA}" -o ../release/luntan-worker ./cmd/worker
          go build -trimpath -ldflags="-s -w -X github.com/zhouwu97/luntan/server/internal/platform/httpserver.BuildVersion=${RELEASE_SHA} -X github.com/zhouwu97/luntan/server/internal/platform/httpserver.BuildCommit=${RELEASE_SHA}" -o ../release/luntan-migrate ./cmd/migrate
          cp -R migrations/. ../release/migrations/
          cp -R ../build/web/. ../release/web/
          install -m 0755 ../scripts/staging-smoke.sh ../release/staging-smoke.sh
          printf 'commit=%s\n' "$RELEASE_SHA" > ../release/release-metadata.txt
          test -x ../release/luntan-api
          test -x ../release/luntan-worker
          test -x ../release/luntan-migrate
          test -f ../release/web/index.html
          (cd .. && tar -czf "staging-release-${RELEASE_SHA}.tar.gz" release)

      - name: Build and push immutable GHCR image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}/luntan-api:${{ inputs.release_sha }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          case "$IMAGE_TAG" in
            *:latest) echo "latest tag is forbidden" >&2; exit 1 ;;
          esac
          docker build \
            --build-arg BUILD_VERSION="$RELEASE_SHA" \
            --build-arg BUILD_COMMIT="$RELEASE_SHA" \
            --tag "$IMAGE_TAG" server
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_TAG"

      - name: Upload immutable staging release archive
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ inputs.release_sha }}
          path: staging-release-${{ inputs.release_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Migrate, deploy, smoke test and verify rollout
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Download immutable release archive
        uses: actions/download-artifact@v4
        with:
          name: staging-release-${{ inputs.release_sha }}
          path: release-archive

      - name: Configure SSH deployment identity
        id: ssh
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$STAGING_SSH_PRIVATE_KEY"
          install -m 0700 -d "$HOME/.ssh"
          key_file="$RUNNER_TEMP/staging-deploy-key"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Deploy release to systemd staging host
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KEY_FILE: ${{ steps.ssh.outputs.key_file }}
        run: |
          set -eu
          test -n "$STAGING_SSH_HOST"
          test -n "$STAGING_SSH_USER"
          test -f "$SSH_KEY_FILE"
          case "$STAGING_BASE_URL" in
            https://*) ;;
            *) echo "staging_base_url must use HTTPS" >&2; exit 1 ;;
          esac
          ssh_port="${STAGING_SSH_PORT:-22}"
          remote="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          remote_dir=/opt/luntan-qa/staging/incoming
          remote_archive="$remote_dir/staging-release-${RELEASE_SHA}.tar.gz"
          remote_deploy="$remote_dir/deploy-staging-${RELEASE_SHA}.sh"
          remote_rollback="$remote_dir/rollback-staging-${RELEASE_SHA}.sh"
          archive="release-archive/staging-release-${RELEASE_SHA}.tar.gz"
          test -f "$archive"

          ssh-keyscan -p "$ssh_port" -H "$STAGING_SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh_opts=(-i "$SSH_KEY_FILE" -p "$ssh_port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_opts=(-i "$SSH_KEY_FILE" -P "$ssh_port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$remote" "install -d -m 0755 '$remote_dir'"
          scp "${scp_opts[@]}" "$archive" "$remote:$remote_archive"
          scp "${scp_opts[@]}" scripts/deploy-staging.sh "$remote:$remote_deploy"
          scp "${scp_opts[@]}" scripts/rollback-staging.sh "$remote:$remote_rollback"
          printf -v quoted_base '%q' "$STAGING_BASE_URL"
          ssh "${ssh_opts[@]}" "$remote" \
            "chmod 0755 '$remote_deploy' '$remote_rollback' && install -m 0755 '$remote_rollback' /opt/luntan-qa/staging/rollback-staging.sh && STAGING_BASE_URL=$quoted_base LUNTAN_STAGING_DIR=/opt/luntan-qa bash '$remote_deploy' '$remote_archive' '$RELEASE_SHA' && rm -f '$remote_deploy' '$remote_rollback'"
