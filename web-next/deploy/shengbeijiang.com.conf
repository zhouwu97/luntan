# Shengbeijiang Next.js 主站：根域名直接打开新版 Web，不再跳转到旧 Flutter /forum/。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shengbeijiang.com www.shengbeijiang.com;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/v1 {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080/health;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:18080/ready;
        proxy_set_header Host $host;
    }

    location ^~ /_protected_media/ {
        internal;
        alias /opt/luntan-qa/imported-media/user-media/;
    }

    location = /imported-media/user-media {
        return 404;
    }

    location ^~ /imported-media/user-media/ {
        return 404;
    }

    location ^~ /imported-media/ {
        alias /opt/luntan-qa/imported-media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /media/ {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location = /forum {
        return 301 /;
    }

    location ^~ /forum/ {
        return 301 /;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    ssl_certificate /etc/letsencrypt/live/shengbeijiang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shengbeijiang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name shengbeijiang.com www.shengbeijiang.com;
    return 301 https://shengbeijiang.com$request_uri;
}

# 保留旧发布下载子域名；主站根域名不再使用旧 Flutter 页面。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dl.shengbeijiang.com;

    location ^~ /releases/ {
        alias /opt/luntan-qa/releases/app-update-20260901/release/releases/;
        default_type application/vnd.android.package-archive;
        gzip off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }

    ssl_certificate /etc/letsencrypt/live/shengbeijiang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shengbeijiang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name dl.shengbeijiang.com;
    return 301 https://dl.shengbeijiang.com$request_uri;
}
