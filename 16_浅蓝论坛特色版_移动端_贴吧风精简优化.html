<style>

.icon-btn svg{width:20px;height:20px}.count{position:absolute;right:-2px;top:-3px;height:18px;min-width:18px;padding:0 5px;border-radius:999px;background:#ff6666;color:#fff;border:2px solid #fff;font-size:10px;font-weight:800;display:grid;place-items:center}

.feed-filter{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.feed-filter-left{display:flex;gap:18px}.mini-tab{background:none;border:0;padding:6px 0;font-size:15px;color:#8296aa;position:relative;font-weight:700}.mini-tab.active{color:#203449}.mini-tab.active:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;width:22px;height:3px;border-radius:999px;background:linear-gradient(90deg,#71cfff,#54a3ff,#85b4ff)}

.rank-list{display:flex;flex-direction:column;gap:10px}.rank-row{display:grid;grid-template-columns:20px 1fr auto;gap:7px;align-items:center}.rank-row em{font-style:normal;font-weight:900;color:#6b84a1}.rank-row:nth-child(1) em{color:#ff8f67}.rank-row:nth-child(2) em{color:#ffa947}.rank-row:nth-child(3) em{color:#7bb3ff}.rank-row span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-row small{font-size:11px;color:#7e93a6}
.guide-card{padding:12px;display:flex;flex-direction:column;gap:10px}.guide-pill{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#f7fbff,#edf5ff);border:1px solid #dde9f6}.guide-pill b{font-size:14px}.guide-pill span{font-size:12px;color:#6e84a1}

.post:active{transform:scale(.992);border-color:#bcd4ed}
.post-top{display:flex;align-items:center;gap:10px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800;flex:0 0 auto}
.avatar.a1{background:linear-gradient(135deg,#72afff,#4b89ff)}.avatar.a2{background:linear-gradient(135deg,#7fd2ef,#59b7dd)}.avatar.a3{background:linear-gradient(135deg,#ff9eb7,#ff789f)}.avatar.a4{background:linear-gradient(135deg,#79d2a3,#58bc8b)}
.author{min-width:0;flex:1}.author b{display:block;font-size:13px}.author span{display:block;font-size:11px;color:#7d91a4;margin-top:3px}.post-menu{color:#8ba0b3;font-size:20px;line-height:1}
.post-body{display:grid;grid-template-columns:1fr 88px;gap:12px;margin-top:10px}.post.no-thumb .post-body{grid-template-columns:1fr}
.post h3{margin:0 0 8px;font-size:17px;line-height:1.35}.post p{margin:0;color:#546a7f;font-size:13px;line-height:1.5}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid transparent}.tag.board1{background:#edf5ff;color:#4f88d8;border-color:#d7e8ff}.tag.board2{background:#f1edff;color:#7868d8;border-color:#e2dbff}.tag.board3{background:#fff3ea;color:#d88e49;border-color:#ffe2c3}.tag.good{background:#eff9f5;color:#4ea47c;border-color:#d8f1e5}
.thumb{height:86px;border-radius:14px;border:1px solid #e3ecf5;background-position:center;background-size:cover;overflow:hidden}
.thumb.keyboard{background:linear-gradient(135deg,#303956,#5867af 45%,#c0caf9 100%);position:relative}.thumb.keyboard:before{content:"";position:absolute;left:10px;right:10px;top:18px;height:42px;border-radius:7px;background:repeating-linear-gradient(90deg,#fff 0 5px,#7d89c8 5px 7px),repeating-linear-gradient(0deg,transparent 0 7px,rgba(0,0,0,.28) 7px 9px);transform:skew(-6deg)}
.thumb.campus{background:linear-gradient(135deg,#ffe0c2,#f9be88 45%,#ff9292)}
.thumb.daily{background:linear-gradient(135deg,#d0eaff,#e7f4ff 40%,#9ebeff);position:relative}.thumb.daily:before{content:"";position:absolute;left:15px;right:15px;bottom:16px;height:22px;border-radius:999px;background:linear-gradient(90deg,#79aaf0,#4d76dd)}.thumb.daily:after{content:"";position:absolute;width:34px;height:34px;right:18px;top:18px;border-radius:50%;background:#fff;box-shadow:-40px 14px 0 0 rgba(255,255,255,.85),-68px 18px 0 -4px rgba(255,255,255,.76)}
.thumb.market{background:linear-gradient(135deg,#fefefe,#e5e5e5 40%,#b8c5d8);position:relative}.thumb.market:before{content:"";position:absolute;left:29px;top:10px;width:30px;height:62px;border-radius:4px;background:#1e1e1e;transform:rotate(-8deg);box-shadow:0 0 0 2px rgba(255,255,255,.75)}.thumb.market:after{content:"Kindle";position:absolute;left:34px;bottom:15px;font-size:7px;color:#f2f2f2;transform:rotate(-8deg)}
.post-footer{display:flex;align-items:center;gap:14px;color:#7c90a3;font-size:12px;margin-top:11px;flex-wrap:wrap}.post-footer .spacer{flex:1}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);padding:8px 14px calc(var(--safe-bottom) + 6px);background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid #d9e3ee;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;z-index:20}
.nav-item{border:0;background:none;color:#8092a6;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;position:relative}
.nav-item svg{width:21px;height:21px}.nav-item.active{color:#347ddb}.nav-item.active.home{color:#34a0db}.nav-item.active.me{color:#6d78ff}
.create-wrap{display:grid;place-items:center}.create-btn{width:58px;height:58px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,#79d7ee,#57b7ff 42%,#5c90ff);box-shadow:0 12px 24px rgba(86,151,255,.30);display:grid;place-items:center;transform:translateY(-10px)}.create-btn svg{width:26px;height:26px}
.sheet-mask{position:fixed;inset:0;background:rgba(18,36,57,.22);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.2s;z-index:30}.sheet-mask.show{opacity:1;pointer-events:auto}.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px calc(var(--safe-bottom) + 20px);box-shadow:0 -12px 36px rgba(29,61,102,.18);transform:translateY(100%);transition:.25s}.sheet-mask.show .sheet{transform:translateY(0)}.grab{width:42px;height:5px;border-radius:999px;background:#d6e2ef;margin:0 auto 14px}.sheet h3{margin:0 0 14px;font-size:18px}.pub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pub{border:1px solid var(--line);background:linear-gradient(180deg,#fbfdff,#f2f8ff);border-radius:18px;padding:16px 10px;color:#385674;text-align:center;font-weight:800}.pub b{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;margin:0 auto 10px;background:linear-gradient(135deg,#e5f1ff,#d6eaff);color:#4584df;font-size:18px}
.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%) translateY(10px);background:rgba(28,45,65,.92);color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:370px){.feature-row{gap:7px}.feature-ico{width:48px;height:48px}.feature-btn span{font-size:11px}.hot-module{grid-template-columns:1fr}.post h3{font-size:16px}}

<style id="optimize-overrides">

<style id="optimize-07-overrides">
/* 07：按最新确认继续收紧。顶部=头像 + 搜索 + 消息；底部移除“板块”；帖子缩略图固定比例。 */
.compact-header{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:10px;padding:8px 14px 10px}
.profile-avatar{width:40px;height:40px;border:0;border-radius:50%;padding:2px;background:linear-gradient(145deg,#8fd2ff,#689cff 52%,#8179ff);box-shadow:0 7px 16px rgba(73,125,199,.18);position:relative}
.profile-avatar:after{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid rgba(255,255,255,.82);pointer-events:none}
.profile-avatar span{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;color:#fff;font-size:15px;font-weight:900;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,0))}
.top-search{height:40px;min-width:0;border:1px solid #d8e4f0;border-radius:14px;background:rgba(255,255,255,.86);box-shadow:0 5px 14px rgba(68,112,168,.06);color:#8297ab;padding:0 12px;display:flex;align-items:center;gap:8px;text-align:left}
.top-search svg{width:17px;height:17px;flex:0 0 auto}.top-search span{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top-message{width:40px;height:40px;border:0;background:transparent;color:#405b76;display:grid;place-items:center;position:relative}.top-message svg{width:24px;height:24px}.top-message .count{right:-1px;top:-3px;border-color:#eef4fb}
/* 三主板块依然只作为顶部一级分类，不再占用底部导航位。 */
.board-tabs{padding:0 14px 6px;gap:4px}.board-tab{height:38px;border-radius:10px;font-size:15px}.board-tab.active{box-shadow:none;background:transparent;border-color:transparent;color:#172e45;position:relative}.board-tab.active:after{content:"";position:absolute;left:50%;bottom:1px;width:24px;height:3px;border-radius:999px;transform:translateX(-50%);background:linear-gradient(90deg,#79cfff,#559fff)}
/* 功能入口略缩小，减少第一屏压迫。 */
.feature-row{gap:8px;padding-top:8px}.feature-ico{width:45px;height:45px;border-radius:15px;margin-bottom:6px}.feature-ico i{width:25px;height:25px;border-radius:8px;font-size:13px}.feature-btn span{font-size:11px}
.search-box{height:44px;margin-top:12px;border-radius:15px;box-shadow:none;background:rgba(255,255,255,.82)}
.feed-filter{padding:12px 1px 10px;margin:0 0 8px;border-bottom:1px solid #dce7f2}.feed-filter-left{gap:20px}.mini-tab{font-size:14px}.chip-btn{height:30px;padding:0 11px;box-shadow:none;font-size:12px}
/* 取消冗余“正在浏览/帖子列表”标题，直接进入信息流。 */
.feed-divider,.section-title{display:none!important}
.post-list{gap:8px}.post{padding:12px 12px 11px;border-radius:15px;box-shadow:0 6px 18px rgba(68,112,168,.065)}
.post-top{gap:8px}.avatar{width:28px;height:28px}.author b{font-size:12.5px}.author span{font-size:10px}.post-menu{font-size:18px}
.post-body{grid-template-columns:minmax(0,1fr) 76px;gap:10px;margin-top:8px;align-items:start}.post.no-thumb .post-body{grid-template-columns:1fr}
.post h3{font-size:15px;line-height:1.38;margin:0 0 5px}.post p{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tag-row{margin-bottom:6px;gap:5px}.tag{height:21px;padding:0 7px;font-size:10px}
/* 像杯友酱那样使用统一右侧封面：固定正方形比例，缩小并裁切，避免每帖高度跳动。 */
.thumb{width:76px;height:auto;aspect-ratio:1/1;border-radius:11px;justify-self:end;background-size:cover;background-position:center}
.thumb.keyboard:before{left:8px;right:8px;top:16px;height:36px}
.post-footer{gap:11px;margin-top:8px;padding-top:8px;font-size:11px}
/* 底部不再显示“板块”，保留：首页 / 中间发布 / 消息 / 我的。 */

let currentBoard='拆箱';
let currentSort='推荐';

const boardLabels={拆箱:'大型拆箱',社区:'酱紫社区',日常:'杂鱼日常'};

function renderRanks(){}
function renderHead(){
  const inline=document.getElementById('inlineBoardTitle'); if(inline) inline.textContent=`${boardLabels[currentBoard]} · ${currentSort}`;
}
function mediaSpec(post){
  const t=post.title;
  if(!post.thumb) return null;
  if(t.includes('机械键盘开箱')) return {layout:'three',items:['keyboard','keyboard','keyboard']};
  if(t.includes('食堂')) return {layout:'two',items:['campus','campus']};
  if(t.includes('Kindle')) return {layout:'single portrait',items:['market']};
  if(t.includes('绿植')) return {layout:'single portrait',items:['daily']};
  if(t.includes('晚霞')||t.includes('夜跑')||t.includes('校园随拍')) return {layout:'single landscape',items:['campus']};
  if(t.includes('桌面')||t.includes('显示器')||t.includes('投影')) return {layout:'single landscape',items:[post.thumb]};
  if(t.includes('生活地图')||t.includes('好物整理')) return {layout:'four',items:[post.thumb,post.thumb,post.thumb,post.thumb],more:2};
  return {layout:'single square',items:[post.thumb]};
}
const authorLevels={
  '小理不理':6,'桌搭同学':4,'安静一点':5,'像素观察员':3,'收纳达人':4,
  '吃吃吃同学':5,'纠结新人':2,'慢跑观察员':4,'临时抱佛脚':2,'别再丢了':3,
  '校园百科':8,'沉迷学习':6,'晚风路人':4,'转转达人':5,'阳台观察员':3,
  '跑步路人':4,'生活整理员':7,'选购整理员':6
};
function getAuthorLevel(author){return authorLevels[author]||3}
function levelClass(level){if(level>=8)return 'lv-top';if(level>=6)return 'lv-high';if(level>=4)return 'lv-mid';return 'lv-low'}

function renderMedia(post){
  const spec=mediaSpec(post);
  if(!spec) return '';
  const items=spec.items.map((kind,idx)=>`<div class="media-item ${kind}">${spec.more&&idx===spec.items.length-1?`<span class="media-more">+${spec.more}</span>`:''}</div>`).join('');
  return `<div class="post-media ${spec.layout}">${items}</div>`;
}
function renderPosts(){
  const list=data[currentBoard].posts[currentSort]||[];
  document.getElementById('postList').innerHTML=list.map(post=>{
    const tags=`<div class="tag-row"><span class="tag ${post.tagClass}">${post.tag}</span>${post.extra?`<span class="tag ${post.extraClass}">${post.extra}</span>`:''}</div>`;
    return `<article class="post" onclick="showToast('打开帖子：${post.title.replace(/'/g,'')}')">
      <div class="post-top">
        <div class="avatar ${post.avatar}">${post.author.slice(0,1)}</div>
        <div class="author">
          <div class="author-name-row"><b>${post.author}</b><span class="level-badge ${levelClass(getAuthorLevel(post.author))}">Lv.${getAuthorLevel(post.author)}</span></div>
          <span>${boardLabels[currentBoard]} · ${post.time}</span>
        </div>
        <div class="post-menu">···</div>
      </div>
      <div class="post-body">
        ${tags}
        <h3>${post.title}</h3>
        <p>${post.summary}</p>
        ${renderMedia(post)}
        <div class="post-footer">
          <span>💬 ${post.comments}</span>
          <span>👁 ${post.views}</span>
          <span>♡ 收藏</span>
          <span class="spacer"></span>
          <span>进入帖子</span>
        </div>
      </div>
    </article>`;
  }).join('');
}
function renderAll(){renderHead();renderRanks();renderPosts();}

document.querySelectorAll('#boardTabs .board-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#boardTabs .board-tab').forEach(x=>x.classList.remove('active'));

    currentBoard=btn.dataset.board;
    renderAll();
  });
});
document.querySelectorAll('#sortTabs .mini-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#sortTabs .mini-tab').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    currentSort=btn.dataset.sort;
    renderAll();
  });
});

function refreshFeed(){
  const fab=document.getElementById('refreshFab');
  if(fab.classList.contains('spinning')) return;
  fab.classList.add('spinning');
  const list=document.getElementById('postList');
  list.style.opacity='.55';
  list.style.transform='translateY(4px)';
  setTimeout(()=>{
    renderPosts();
    list.style.transition='opacity .22s,transform .22s';
    list.style.opacity='1';
    list.style.transform='translateY(0)';
    fab.classList.remove('spinning');
    showToast(`${boardLabels[currentBoard]}已刷新`);
  },520);
}

function openComposer(){document.getElementById('sheet').classList.add('show')}
function closeComposer(){document.getElementById('sheet').classList.remove('show')}
let toastTimer;
function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}

function showProfile(){
  document.querySelector('.app').classList.add('show-profile');
  document.querySelector('.bottom-nav .home').classList.remove('active');
  document.querySelector('.bottom-nav .me').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function showHome(){
  document.querySelector('.app').classList.remove('show-profile');
  document.querySelector('.bottom-nav .me').classList.remove('active');
