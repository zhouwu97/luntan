name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Read application version from pubspec
        id: app_version
        shell: bash
        run: |
          set -eu
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+)$/\1/p' pubspec.yaml | head -n 1)"
          case "$version" in
            +*|*+|*+*+*|'') echo "pubspec.yaml version must be name+code" >&2; exit 1 ;;
          esac
          version_name="${version%%+*}"
          version_code="${version##*+}"
          printf '%s\n' "$version_name" | grep -Eq '^[0-9A-Za-z._-]+$'
          printf '%s\n' "$version_code" | grep -Eq '^[1-9][0-9]*$'
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      # CI 只生成临时签名用于验证 release 构建，不得把该密钥用于正式发行。
      - name: Generate CI-only Android signing key
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ci-only-release-password
          ANDROID_RELEASE_KEY_PASSWORD: ci-only-release-password
        run: >-
          keytool -genkeypair -v
          -keystore android/app/ci-release.keystore
          -storetype PKCS12
          -storepass "$ANDROID_RELEASE_STORE_PASSWORD"
          -keypass "$ANDROID_RELEASE_KEY_PASSWORD"
          -alias ci-release
          -keyalg RSA
          -keysize 2048
          -validity 1
          -dname "CN=CI Release, OU=CI, O=Luntan, C=CN"
      # Release 构建显式注入配置；客户端即使被其他入口漏传参数，也只会回退到
      # 官方 HTTPS 地址，不会退回 Mock 或明文 API。
      - run: >-
          flutter build web --release --base-href=/forum/
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://shengbeijiang.com
          --dart-define=WEB_BASE_URL=https://shengbeijiang.com
      - run: >-
          flutter build apk --release
          --build-name "${{ steps.app_version.outputs.version_name }}"
          --build-number "${{ steps.app_version.outputs.version_code }}"
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://shengbeijiang.com
          --dart-define=WEB_BASE_URL=https://shengbeijiang.com
        env:
          # 相对 gradle rootProject（android/）解析，与 keytool 生成的 android/app/ci-release.keystore 是同一文件。
          ANDROID_RELEASE_STORE_FILE: app/ci-release.keystore
          ANDROID_RELEASE_STORE_TYPE: PKCS12
          ANDROID_RELEASE_STORE_PASSWORD: ci-only-release-password
          ANDROID_RELEASE_KEY_ALIAS: ci-release
          ANDROID_RELEASE_KEY_PASSWORD: ci-only-release-password
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luntan
          POSTGRES_PASSWORD: luntan
          POSTGRES_DB: luntan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luntan -d luntan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://luntan:luntan@localhost:5432/luntan_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要完整历史，才能覆盖当前提交之外的泄露记录。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # 集成测试共用 CI PostgreSQL；包级并发会让迁移和测试数据互相竞态。
      # Migrate 本身也持有 advisory lock，串行包执行保证 fixture 不跨包交叉。
      - run: go test -p 1 ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      # 漏洞检查与日常测试同为门禁，避免依赖升级引入已知可达漏洞。
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要完整历史，才能覆盖整个提交历史中的泄露记录。
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: true

