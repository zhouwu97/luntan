name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build apk --debug

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luntan
          POSTGRES_PASSWORD: luntan
          POSTGRES_DB: luntan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luntan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://luntan:luntan@localhost:5432/luntan_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      # 集成测试共用 CI PostgreSQL；包级并发会让迁移和测试数据互相竞态。
      # Migrate 本身也持有 advisory lock，串行包执行保证 fixture 不跨包交叉。
      - run: go test -p 1 ./...
      - run: go vet ./...
      - run: go build ./cmd/...
