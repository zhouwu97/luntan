name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release 构建必须按生产规则注入配置：客户端在 release 且未显式声明
      # APP_ENV 时按 production 校验，缺少 API_BASE_URL 会直接进入启动错误页。
      - run: >-
          flutter build web --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://shengbeijiang.com
          --dart-define=WEB_BASE_URL=https://shengbeijiang.com
      - run: >-
          flutter build apk --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://shengbeijiang.com
          --dart-define=WEB_BASE_URL=https://shengbeijiang.com
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luntan
          POSTGRES_PASSWORD: luntan
          POSTGRES_DB: luntan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luntan -d luntan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://luntan:luntan@localhost:5432/luntan_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # 集成测试共用 CI PostgreSQL；包级并发会让迁移和测试数据互相竞态。
      # Migrate 本身也持有 advisory lock，串行包执行保证 fixture 不跨包交叉。
      - run: go test -p 1 ./...
      - run: go vet ./...
      - run: go build ./cmd/...
